name: Validación de cambios
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # SUSTITUIR por npm ci después de generar e incluir package-lock.json.
      - run: npm install --no-fund
      - run: npm run check:rules
      - run: npm test
      - run: npm run build
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-fund
      - run: npx firebase emulators:exec --project nodos-educativos-rules-test --only firestore 'npm run test:security'
